<div class="login-container">
  <div class="register-wizard">
    <div class="step-header">
      <i class="fas fa-lock"></i>
      <h2>Ponastavitev gesla</h2>
      <p>Vnesite novo geslo za svoj račun</p>
    </div>

    <div *ngIf="errorMessage" class="alert alert-error">
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="alert alert-success">
      {{ successMessage }}
    </div>

    <form #resetPasswordForm="ngForm" (ngSubmit)="resetPassword()" *ngIf="token">
      <div class="form-group">
        <label for="newPassword">
          <i class="fas fa-lock"></i> Novo geslo
        </label>

        <input
          type="password"
          id="newPassword"
          name="newPassword"
          placeholder="••••••••"
          class="form-input"
          required
          minlength="6"
          [(ngModel)]="newPassword"
          [disabled]="loading"
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">
          <i class="fas fa-lock"></i> Potrdite geslo
        </label>

        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          placeholder="••••••••"
          class="form-input"
          required
          minlength="6"
          [(ngModel)]="confirmPassword"
          [disabled]="loading"
        />
      </div>

      <button
        type="submit"
        class="btn-primary btn-large"
        style="width: 100%;"
        [disabled]="loading || resetPasswordForm.invalid"
      >
        <span *ngIf="!loading">
          <i class="fas fa-check"></i> Ponastavi geslo
        </span>

        <span *ngIf="loading">
          Ponastavljanje...
        </span>
      </button>
    </form>

    <div class="wizard-nav" style="justify-content: center; margin-top: 1rem;">
      <a routerLink="/login" class="btn-secondary">
        Nazaj na prijavo
      </a>
    </div>
  </div>
</div>
