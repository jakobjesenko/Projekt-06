<div class="admin-panel">
  <div class="admin-header">
    <h1><i class="fas fa-user-shield"></i> Admin Panel</h1>
  </div>

  <!-- Stats Overview -->
  <div class="admin-stats">
    <div class="stat-card" *ngFor="let stat of stats">
      <i [class]="stat.icon"></i>
      <div class="stat-number">{{ stat.value }}</div>
      <div class="stat-label">{{ stat.label }}</div>
    </div>
  </div>

  <!-- Users Table -->
  <div class="admin-table-container">
    <h3><i class="fas fa-users"></i> Uporabniki</h3>
    <table class="admin-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Uporabnik</th>
          <th>E-pošta</th>
          <th>Lokacija</th>
          <th>Status</th>
          <th>Akcije</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td>{{ user.id }}</td>
          <td>{{ user.username }}</td>
          <td>{{ user.email }}</td>
          <td>{{ user.location }}</td>
          <td>
            <span [class]="user.isActive ? 'status-badge-active' : 'status-badge-inactive'">
              {{ user.isActive ? 'Aktiven' : 'Deaktiviran' }}
            </span>
          </td>
          <td>
            <button [class]="user.isActive ? 'deactivate-btn' : 'activate-btn'">
              <i [class]="user.isActive ? 'fas fa-ban' : 'fas fa-check-circle'"></i>
              {{ user.isActive ? 'Deaktiviraj' : 'Aktiviraj' }}
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
