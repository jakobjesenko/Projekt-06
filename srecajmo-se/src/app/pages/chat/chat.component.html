<div class="chat-page">
  <div class="panel chat-panel">
    <div class="chat-header">
      <button type="button" class="btn-secondary" (click)="goBack()">
        <i class="fas fa-arrow-left"></i> Nazaj
      </button>

      <div>
        <h2><i class="fas fa-comments"></i> {{ meetingName }}</h2>
        <p>Klepet za potrjeno srečanje</p>
      </div>
    </div>

    <div *ngIf="errorMessage" class="alert alert-error">
      {{ errorMessage }}
    </div>

    <div *ngIf="loading" class="chat-loading">
      Nalaganje sporočil...
    </div>

    <div
      class="chat-window"
      *ngIf="!loading"
      (scroll)="onScroll($event)"
    >
      <div *ngIf="loadingOlder" class="older-loading">
        Nalaganje starejših sporočil...
      </div>

      <div *ngIf="noMoreMessages && messages.length > 0" class="older-loading">
        Ni več starejših sporočil.
      </div>

      <div
        class="chat-message"
        *ngFor="let msg of messages"
        [class.my-message]="isMyMessage(msg)"
      >
        <div class="message-meta">
          <img
            *ngIf="msg.userImage"
            [src]="msg.userImage"
            alt="Avatar"
            class="message-avatar"
          />

          <span class="message-author">
            {{ msg.username }}
          </span>

          <span class="message-time">
            {{ msg.timestamp | date:'short' }}
          </span>
        </div>

        <div class="message-bubble" *ngIf="editingMessageId !== msg._id">
          {{ msg.message }}
        </div>

        <div class="edit-box" *ngIf="editingMessageId === msg._id">
          <input
            type="text"
            name="editingText"
            class="form-input"
            [(ngModel)]="editingText"
            maxlength="500"
          />

          <div class="edit-actions">
            <button type="button" class="btn-primary" (click)="saveEdit(msg)">
              Shrani
            </button>

            <button type="button" class="btn-secondary" (click)="cancelEdit()">
              Prekliči
            </button>
          </div>
        </div>

        <div class="message-actions" *ngIf="canModifyMessage(msg) && editingMessageId !== msg._id">
          <button type="button" class="btn-secondary" (click)="startEdit(msg)">
            Uredi
          </button>

          <button type="button" class="btn-secondary" (click)="deleteMessage(msg)">
            Izbriši
          </button>
        </div>
      </div>

      <div *ngIf="messages.length === 0" class="empty-chat">
        <i class="fas fa-comment-dots"></i>
        <h3>Ni še sporočil</h3>
        <p>Začni pogovor s skupino.</p>
      </div>
    </div>

    <form class="chat-form" (ngSubmit)="sendMessage()" *ngIf="!loading">
      <input
        type="text"
        name="newMessage"
        class="form-input"
        placeholder="Napiši sporočilo..."
        [(ngModel)]="newMessage"
        maxlength="500"
        autocomplete="off"
      />

      <button
        type="submit"
        class="btn-primary"
        [disabled]="sending || !newMessage.trim()"
      >
        <span *ngIf="!sending">
          <i class="fas fa-paper-plane"></i> Pošlji
        </span>

        <span *ngIf="sending">
          Pošiljanje...
        </span>
      </button>
    </form>
  </div>
</div>
