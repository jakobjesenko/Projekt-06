<div class="login-container">
  <div class="register-wizard">
    <div class="step-header">
      <i class="fas fa-key"></i>
      <h2>Pozabljeno geslo</h2>
      <p>Vnesite svoj e-poštni naslov za ponastavitev gesla</p>
    </div>

    <div *ngIf="errorMessage" class="alert alert-error">
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="alert alert-success">
      {{ successMessage }}
    </div>

    <form #forgotPasswordForm="ngForm" (ngSubmit)="sendResetLink()">
      <div class="form-group">
        <label for="email">
          <i class="fas fa-envelope"></i> E-pošta
        </label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="ana@email.com"
          class="form-input"
          required
          email
          [(ngModel)]="email"
          [disabled]="loading"
        />
      </div>

      <button
        type="submit"
        class="btn-primary btn-large"
        style="width: 100%;"
        [disabled]="loading || forgotPasswordForm.invalid"
      >
        <span *ngIf="!loading">
          <i class="fas fa-paper-plane"></i> Pošlji povezavo
        </span>

        <span *ngIf="loading">
          Pošiljanje...
        </span>
      </button>
    </form>

    <div class="wizard-nav" style="justify-content: center; margin-top: 1rem;">
      <a routerLink="/login" class="btn-secondary">
        Nazaj na prijavo
      </a>
    </div>
  </div>
</div>
