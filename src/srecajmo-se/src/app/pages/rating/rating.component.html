<div class="container">
  <div class="rating-card">

    <div class="rating-header">
      <div class="rating-icon">
        <i class="fas fa-star"></i>
      </div>
      <h1>Oceni srečanje</h1>
      <p>Tvoje mnenje nam veliko pomeni</p>
    </div>

    <div class="group-info">
      <h3><i class="fas fa-users"></i> Skupina srečnežev</h3>
      <span class="group-badge">
        <i class="fas fa-calendar-check"></i> 15. 5. 2026, 18:00
      </span>
    </div>

    <div class="stars-container">
      <span class="stars-label"><i class="fas fa-star"></i> Tvoja ocena</span>
      <div class="stars">
        <i class="fas fa-star star" data-value="1"></i>
        <i class="fas fa-star star" data-value="2"></i>
        <i class="fas fa-star star" data-value="3"></i>
        <i class="fas fa-star star" data-value="4"></i>
        <i class="fas fa-star star" data-value="5"></i>
      </div>
    </div>

    <div class="comment-section">
      <label for="comment"><i class="fas fa-comment"></i> Tvoj komentar (neobvezno)</label>
      <textarea
        id="comment"
        class="comment-input"
        placeholder="Kako je bilo srečanje? Kaj ti je bilo všeč? Imaš kakšen predlog za izboljšave?..."
        maxlength="500"
      ></textarea>
      <div class="char-counter">
        <span>0</span>/500 znakov
      </div>
    </div>

    <button class="btn-primary" disabled>
      <i class="fas fa-paper-plane"></i> Pošlji oceno
    </button>

    <div class="divider">
      <span>ali</span>
    </div>

    <button class="btn-secondary">
      <i class="fas fa-arrow-left"></i> Nazaj
    </button>

    <div class="message-container"></div>

  </div>
</div>
